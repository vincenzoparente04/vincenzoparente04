      90.0% { transform: translate(1100.0px, 150.0px); fill-opacity: 0; }
      92.0% { transform: translate(1100.0px, 150.0px); fill-opacity: 1; }
      100% { transform: translate(1120.0px, 223.9px); }
    }
    .n10 { animation: n10 14s cubic-bezier(.65,0,.35,1) infinite; transform: translate(1120.0px, 223.9px); }

    .formula { opacity: 0; animation: formula 14s ease-in-out infinite; }
    @keyframes formula { 0%, 72% { opacity: 0; } 77%, 88% { opacity: 1; } 91%, 100% { opacity: 0; } }

    .label { opacity: 0; animation: 14s ease-in-out infinite; }
    .l1 { opacity: 1; animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    @keyframes l1 { 0%, 28% { opacity: 1; } 32%, 94% { opacity: 0; } 98%, 100% { opacity: 1; } }
    @keyframes l2 { 0%, 34% { opacity: 0; } 40%, 60% { opacity: 1; } 64%, 100% { opacity: 0; } }
    @keyframes l3 { 0%, 66% { opacity: 0; } 72%, 90% { opacity: 1; } 94%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, .l1, .l2, .l3 { animation: none !important; }
    }
