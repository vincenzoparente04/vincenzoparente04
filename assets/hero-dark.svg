<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Vincenzo Parente</title>
  <desc id="desc">MSc Computer Science and Engineering at Politecnico di Milano. An animation turns a signal into a graph and then into a satisfied logic formula.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .expr { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0f6fc; }

    .wave { fill: none; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 620; animation: wave 14s linear infinite; }
    @keyframes wave {
      0%, 28% { stroke-dashoffset: 0; opacity: 1; }
      34% { stroke-dashoffset: 0; opacity: 0; }
      35%, 91% { stroke-dashoffset: 620; opacity: 0; }
      92% { stroke-dashoffset: 620; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    .edges line { stroke: #8b949e; stroke-width: 1.2; }
    .edges { opacity: 0; animation: edges 14s ease-in-out infinite; }
    @keyframes edges { 0%, 40% { opacity: 0; } 46%, 58% { opacity: 1; } 62%, 100% { opacity: 0; } }

    .nodes circle { fill: #f0f6fc; stroke: #f0f6fc; stroke-width: 1.5; }
    
    @keyframes n0 {
      0%, 28.0% { transform: translate(660.0px, 200.0px);  }
      38.0%, 60.0% { transform: translate(690.0px, 140.0px);  }
      70.0% { transform: translate(700.0px, 150.0px);  }
      90.0% { transform: translate(700.0px, 150.0px);  }
      92.0% { transform: translate(700.0px, 150.0px);  }
      100% { transform: translate(660.0px, 200.0px); }
    }
    .n0 { animation: n0 14s cubic-bezier(.65,0,.35,1) infinite; transform: translate(660.0px, 200.0px); }
    @keyframes n1 {
      0%, 28.4% { transform: translate(706.0px, 245.4px); fill-opacity: 1; }
      38.4%, 60.4% { transform: translate(745.0px, 255.0px); fill-opacity: 1; }
      70.2% { transform: translate(740.0px, 150.0px); fill-opacity: 0; }
      90.0% { transform: translate(740.0px, 150.0px); fill-opacity: 0; }
      92.0% { transform: translate(740.0px, 150.0px); fill-opacity: 1; }
      100% { transform: translate(706.0px, 245.4px); }
    }
    .n1 { animation: n1 14s cubic-bezier(.65,0,.35,1) infinite; transform: translate(706.0px, 245.4px); }
    @keyframes n2 {
      0%, 28.8% { transform: translate(752.0px, 256.5px);  }
      38.8%, 60.8% { transform: translate(815.0px, 105.0px);  }
      70.4% { transform: translate(780.0px, 150.0px);  }
